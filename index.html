<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吴越语言变迁</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>吴越地区语言变迁</h1>
      <p class="sub">thematic geo · 示意行政区聚合，非精确同言线 · 数据 v0.5.2 · 江南风</p>
    </div>
    <nav class="layers" id="layerTabs">
      <button type="button" data-layer="era">长时段</button>
      <button type="button" data-layer="branch" class="active">六片分支</button>
      <button type="button" data-layer="city">城市个案</button>
    </nav>
  </header>
  <main class="layout">
    <aside class="panel">
      <article class="story" id="storyPanel" aria-live="polite">
        <p class="story-kicker" id="storyKicker">六片分支</p>
        <h2 class="story-title" id="storyTitle">点击地图或列表</h2>
        <p class="story-year" id="storyYear"></p>
        <p class="story-body" id="storyBody">半透明叠色看片区；再点同一片可取消选中。</p>
      </article>

      <div id="eraControls" class="layer-pane hidden">
        <label for="eraSlider">时间轴</label>
        <input type="range" id="eraSlider" min="0" max="6" value="4" step="1" />
        <p class="hint">拖到某段只亮相关城市；旁白在上方。</p>
      </div>

      <div id="branchControls" class="layer-pane">
        <p class="hint">单击单选，再点取消。悬停只看片名与一句简介。</p>
        <ul id="branchList" class="list"></ul>
      </div>

      <div id="cityControls" class="layer-pane hidden">
        <label for="citySelect">代表城市</label>
        <select id="citySelect"></select>
        <div class="play-row">
          <button type="button" id="playBtn" class="play-btn">自动播放前 3 事</button>
          <span id="cityMeta" class="meta"></span>
        </div>
        <ol id="eventList" class="events"></ol>
        <p class="hint">箭头只跟当前事件；地图点击只换上方文案，不跳页。</p>
      </div>

      <footer class="credit">Observable Plot · GitHub Pages</footer>
    </aside>
    <section class="map-wrap">
      <div id="plot" aria-label="吴越语言地图"></div>
      <div id="legend" class="legend"></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
