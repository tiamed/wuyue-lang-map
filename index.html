<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吴越语言变迁</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>吴越地区语言变迁</h1>
      <p class="sub">thematic geo · 示意行政区聚合，非精确同言线 · 数据 v0.5</p>
    </div>
    <nav class="layers" id="layerTabs">
      <button type="button" data-layer="era">长时段</button>
      <button type="button" data-layer="branch" class="active">六片分支</button>
      <button type="button" data-layer="city">城市个案</button>
    </nav>
  </header>
  <main class="layout">
    <aside class="panel">
      <div id="eraControls" class="layer-pane hidden">
        <label for="eraSlider">时间轴</label>
        <input type="range" id="eraSlider" min="0" max="6" value="4" step="1" />
        <div id="eraLabel" class="era-title"></div>
        <p id="eraSummary" class="body"></p>
      </div>
      <div id="branchControls" class="layer-pane">
        <p class="hint">点击地图色块或下方列表；半透明叠色，看清片区范围。</p>
        <ul id="branchList" class="list"></ul>
        <div id="branchDetail" class="detail"></div>
      </div>
      <div id="cityControls" class="layer-pane hidden">
        <label for="citySelect">代表城市</label>
        <select id="citySelect"></select>
        <div id="cityMeta" class="meta"></div>
        <ol id="eventList" class="events"></ol>
        <p class="hint">只显示当前城的迁徙箭头；点事件可切换。</p>
      </div>
      <footer class="credit">Observable Plot · GitHub Pages</footer>
    </aside>
    <section class="map-wrap">
      <div id="plot" aria-label="吴越语言地图"></div>
      <div id="legend" class="legend"></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
