<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吴越语言变迁</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>吴越地区语言变迁</h1>
      <p class="sub">MapLibre · 示意行政区聚合，非精确同言线 · 数据 v0.6.0 · 今界示意 · 江南风</p>
    </div>
    <nav class="layers" id="layerTabs">
      <button type="button" data-layer="era">长时段</button>
      <button type="button" data-layer="branch" class="active">六片分支</button>
      <button type="button" data-layer="city">城市个案</button>
    </nav>
  </header>
  <main class="layout">
    <aside class="panel">
      <article class="story" id="storyPanel" aria-live="polite">
        <p class="story-kicker" id="storyKicker">六片分支</p>
        <h2 class="story-title" id="storyTitle">点击地图或列表</h2>
        <p class="story-year" id="storyYear"></p>
        <p class="story-body" id="storyBody">单击单选填色，再点取消。悬停只看片名与一句简介。</p>
      </article>

      <div id="eraControls" class="layer-pane hidden">
        <div class="era-nav">
          <button type="button" id="eraPrev" class="era-nav-btn">上一段</button>
          <button type="button" id="eraPlay" class="era-nav-btn">自动讲述</button>
          <button type="button" id="eraNext" class="era-nav-btn">下一段</button>
        </div>
        <p class="hint">点节点切换；空格键也可翻下一段。</p>
        <ol id="eraTimeline" class="timeline"></ol>
        <div class="era-progress" aria-hidden="true">
          <div id="eraProgressBar" class="era-progress-bar"></div>
        </div>
      </div>

      <div id="branchControls" class="layer-pane">
        <p class="hint">单击单选，再点取消。悬停只看片名与一句简介。</p>
        <ul id="branchList" class="list"></ul>
      </div>

      <div id="cityControls" class="layer-pane hidden">
        <p class="hint">点下方城卡或地图圆点切换；进层自动讲述前 3 事。</p>
        <div id="cityChips" class="city-chips"></div>
        <div class="play-row">
          <button type="button" id="playBtn" class="play-btn">重新播放</button>
          <label class="follow-toggle"><input type="checkbox" id="followMigration" /> 跟随迁徙</label>
          <span id="cityMeta" class="meta"></span>
        </div>
        <ol id="eventList" class="events"></ol>
        <p class="hint">默认固定视野不缩放；勾选「跟随迁徙」只平移到中点（zoom 锁定），不缩放。</p>
      </div>

      <footer class="credit">MapLibre GL · GitHub Pages · 无底图 API</footer>
    </aside>
    <section class="map-wrap">
      <div id="map" aria-label="吴越语言地图"></div>
      <div id="legend" class="legend"></div>
    </section>
  </main>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/maplibre-arrows.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
